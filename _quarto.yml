project:
  type: website
  output-dir: _site

website:
  title: "R basics"
  site-url: "https://emzou.github.io/r-guide"
  repo-url: "https://github.com/emzou/r-guide.git"
  repo-actions: [edit, issue]

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: r-setup/index.qmd
        text: "R Setup"
      - href: r-code/index.qmd
        text: "R Code"
      - href: research-design/index.qmd
        text: "Research Design"
    right:
      - icon: github
        href: "https://github.com/emzou/r-guide.git"

  sidebar:
    - id: r-setup
      title: "R Setup"
      style: docked
      collapse-level: 1
      contents:
        - r-setup/index.qmd
        - auto: "r-setup/0*.qmd"

    - id: r-code
      title: "R Code"
      style: docked
      collapse-level: 1
      contents:
        - r-code/index.qmd
        - auto: "r-code/0*.qmd"

    - id: research-design
      title: "Research Design"
      style: docked
      collapse-level: 1
      contents:
        - research-design/index.qmd
        - auto: "research-design/0*.qmd"

  page-footer:
    left: "Last built {{< meta date >}}"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: litera
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto